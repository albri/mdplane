<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>mdplane</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/site.css" />
    <script src="/theme.js"></script>
    <script type="module" src="/reader.js"></script>
  </head>
  <body>
    <header class="site-head" id="top">
      <div class="wrap">
        <a class="brand" href="/">
          <svg viewBox="0 0 22 22" aria-hidden="true">
            <rect class="mk-body" x="2" y="2" width="18" height="10" rx="2.5" />
            <rect class="mk-log" x="2" y="14" width="18" height="2.4" rx="1.2" />
            <rect class="mk-log2" x="2" y="18.4" width="11" height="2.4" rx="1.2" />
          </svg>
          <span>mdplane</span>
        </a>
        <nav class="nav" aria-label="Main">
          <a class="hide-sm" href="/#workspace">How it works</a>
          <a href="/#reader">Reader</a>
          <a class="hide-sm" href="https://github.com/albri/mdplane">Source</a>
          <button type="button" class="theme-btn" id="theme-btn">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5" />
              <path d="M8 1.75a6.25 6.25 0 0 1 0 12.5z" fill="currentColor" />
            </svg>
            <span id="theme-label">System</span>
          </button>
        </nav>
      </div>
    </header>

    <main id="reader-page">
      <div class="wrap rp-head">
        <h1 class="rp-title" id="rp-title">Loading…</h1>
        <p class="rp-sub">
          Use the timeline, or the arrow keys, to move through the history. The space bar plays it.
          New entries appear as they arrive.
        </p>
        <select class="rp-file" id="rp-file" aria-label="File" hidden></select>
        <p class="rp-status" id="rp-status" role="status" hidden></p>
      </div>
      <div class="rp-frame" id="rp-frame" hidden><div id="full-reader"></div></div>
    </main>

    <footer class="site-foot">
      <div class="wrap foot">
        <p><strong>mdplane</strong> is open source under the MIT licence.</p>
        <p>
          <a href="https://github.com/albri/mdplane">Source on GitHub</a> · Made by
          <a href="https://alexbristow.com">Alex Bristow</a>
        </p>
      </div>
    </footer>
  </body>
</html>
