openapi.yaml:
  # A WebSocket upgrade answers 101, never 2xx.
  operation-2xx-response:
    - '#/paths/~1{tier}~1{key}~1live/get/responses'
  # The root and the health check take no input and no key, so they have nothing to refuse.
  operation-4xx-response:
    - '#/paths/~1/get/responses'
    - '#/paths/~1api~1health/get/responses'
  # A live socket's close notice is named only in the stream's x-message, which the linter
  # doesn't follow.
  no-unused-components:
    - '#/components/schemas/LiveClose'
