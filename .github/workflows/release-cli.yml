name: Release CLI

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run npm publish as dry-run only'
        required: true
        type: boolean
        default: true

jobs:
  release-cli:
    name: Publish @mdplane/cli
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        run: |
          git init .
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 origin "+${GITHUB_REF}:refs/remotes/origin/ci-ref"
          git checkout --force refs/remotes/origin/ci-ref
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.0 --activate

      - name: Setup Bun
        run: |
          curl -fsSL https://bun.sh/install | bash -s "bun-v1.2.21"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @mdplane/shared build

      - name: Verify CLI publish tarball (pack smoke)
        run: pnpm --filter @mdplane/cli pack:smoke

      - name: Publish @mdplane/cli (dry-run)
        if: ${{ inputs.dry_run }}
        run: npm publish --access public --dry-run
        working-directory: packages/cli

      - name: Publish @mdplane/cli
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public
        working-directory: packages/cli
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
